<div class="dashboard-container slide-in">
  <!-- Loading State -->
  <app-loading-spinner *ngIf="isLoading" [message]="'Loading today\'s missions...'"></app-loading-spinner>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="error-message">
    <i class="fas fa-exclamation-circle"></i>
    <p>{{ error }}</p>
    <button class="retry-btn" (click)="loadTodayMissions()">
      <i class="fas fa-redo"></i> Retry
    </button>
  </div>

  <!-- Content -->
  <ng-container *ngIf="!isLoading && !error">
    <section class="daily-overview">
      <h2>Today's Progress</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <i class="fas fa-fire"></i>
          <div class="stat-info">
            <span class="stat-value">{{completedToday}}/{{totalToday}}</span>
            <span class="stat-label">Tasks Completed</span>
          </div>
        </div>
        <div class="stat-card">
          <i class="fas fa-brain"></i>
          <div class="stat-info">
            <span class="stat-value">{{xpEarnedToday}}</span>
            <span class="stat-label">XP Earned Today</span>
          </div>
        </div>
        <div class="stat-card">
          <i class="fas fa-clock"></i>
          <div class="stat-info">
            <span class="stat-value">{{activeMissions.length}}</span>
            <span class="stat-label">Active Missions</span>
          </div>
        </div>
      </div>
    </section>

    <section class="current-missions">
      <div class="section-header">
        <h2>Active Missions</h2>
        <a routerLink="/missions" class="view-all">View All</a>
      </div>

      <!-- Empty State -->
      <app-empty-state
        *ngIf="activeMissions.length === 0"
        icon="fa-tasks"
        title="No Active Missions"
        message="Create a goal to get started with AI-generated daily missions"
        actionText="Create Goal"
        actionIcon="fa-plus"
        [onAction]="navigateToGoals.bind(this)">
      </app-empty-state>

      <!-- Missions Grid -->
      <div class="missions-grid" *ngIf="activeMissions.length > 0">
        <div class="mission-card" *ngFor="let mission of activeMissions">
          <div class="mission-header">
            <span class="mission-type">{{mission.type}}</span>
            <span class="mission-xp">+{{mission.xp}} XP</span>
          </div>
          <h3>{{mission.title}}</h3>
          <p>{{mission.description}}</p>
          <button class="complete-btn" [class.completed]="mission.status === 'completed'">
            {{mission.status === 'completed' ? 'Completed' : 'Complete'}}
          </button>
        </div>
      </div>
    </section>
  </ng-container>
</div>
